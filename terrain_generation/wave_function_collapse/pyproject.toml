[project]
name = "wave-function-collapse"
version = "0.1.0"
description = "Python implementation of the Wave function collapse (WFC) algorithm."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "pydantic>=2.13.2",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wave_function_collapse"]

[tool.deptry]
known_first_party = ["wave_function_collapse"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Tests put two blank lines between imports and the section comments.
"tests/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["wave_function_collapse"]

[tool.docstring_tailor]
line-length = 88
style = "google"
detect-lists = true
