[project]
name = "decision-trees"
version = "0.1.0"
description = "Python implementation for ML decision tree's."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "polars>=1.44.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dts"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.deptry]
# The package is named "dts" in src/, while the project is named "decision-trees".
known_first_party = ["dts"]

[tool.ruff.lint.per-file-ignores]
# Tests put two blank lines between imports and the section comments.
"tests/**" = ["I001"]

[tool.docstring_tailor]
line-length = 80
style = "google"
