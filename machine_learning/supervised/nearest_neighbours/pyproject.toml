[project]
name = "knn"
version = "0.1.0"
description = "Python implementation of the k-nearest neighbours classifier."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.89",
]
# Interactive marimo notebook (knn_classifier.py) and its drawdata widget.
notebook = [
    "drawdata",
    "marimo>=0.16.2",
    "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knn"]

[tool.deptry]
known_first_party = ["knn"]

# The marimo notebook imports these; they belong to the "notebook" group, not runtime.
[tool.deptry.per_rule_ignores]
DEP004 = ["marimo", "drawdata"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.docstring_tailor]
line-length = 80
style = "google"
